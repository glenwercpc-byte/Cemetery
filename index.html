<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCPC 묘지 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ====== INTRO ====== -->
<div id="introOverlay">
  <div id="introMap">
    <img id="introMapImg" src="cemetery-map.png" alt="Ridgewood Cemetery Map">
    <div id="introZoneHint"><div id="introZoneRing"></div></div>
    <div id="introClickPrompt">
      <div class="intro-logo">⛪</div>
      <div class="intro-title">CCPC 묘지 관리 시스템</div>
      <div class="intro-sub">Chicago Covenant Presbyterian Church</div>
      <div class="intro-click">화면을 클릭하여 시작하세요</div>
    </div>
  </div>
</div>

<!-- ====== 앱 본체 ====== -->
<header class="app-header">
  <div class="app-title">
    <span class="mark">⛪ CCPC 묘지 관리</span>
    <span class="sub">Chicago Covenant Presbyterian Church · Cemetery Records</span>
  </div>
  <div class="header-actions">
    <button class="btn" id="btnSync">⟳ 새로고침</button>
    <button class="btn btn-ghost" id="btnAdminToggle">⚙ 관리자 모드</button>
  </div>
</header>

<div class="main">

  <div id="adminBanner" class="admin-toggle-banner" style="display:none;">
    <span>🔓 관리자 모드 — 한글 이름 편집, 상태 수정 가능합니다.</span>
    <button class="btn btn-sm" id="btnAdminOff">끄기</button>
  </div>

  <!-- 탭 + 섹션 선택 + 검색 -->
  <div class="toolbar">
    <div class="section-switch">
      <div class="chip active" data-section="16">Section 16</div>
      <div class="chip" data-section="15">Section 15</div>
    </div>

    <div class="view-tabs">
      <button class="view-tab active" data-view="list">📋 List View</button>
      <button class="view-tab" data-view="map">🗺 Map View</button>
      <button class="view-tab" data-view="stats">📊 통계</button>
    </div>

    <div class="search-box" id="searchWrap">
      <span class="icon">🔎</span>
      <input type="text" id="searchInput" placeholder="이름, Lot, Grave 번호 검색...">
    </div>
  </div>

  <div class="legend" id="legendBar">
    <div class="legend-item"><span class="swatch A"></span> Available</div>
    <div class="legend-item"><span class="swatch R"></span> Reserved</div>
    <div class="legend-item"><span class="swatch C"></span> To Be Confirmed</div>
    <div class="legend-item"><span class="swatch U"></span> Used</div>
    <span class="muted" id="lastSync"></span>
  </div>

  <!-- ====== LIST VIEW ====== -->
  <div id="viewList">
    <div class="list-wrap" id="listContainer"></div>
  </div>

  <!-- ====== MAP VIEW ====== -->
  <div id="viewMap" style="display:none;">
    <div class="map-img-wrap" id="mapImgWrap">
      <div class="map-img-inner" id="mapImgInner">
        <img id="mapImg" src="" alt="Section Map">
      </div>
    </div>
    <div class="map-controls">
      <button class="btn btn-sm" id="btnZoomIn">＋ 확대</button>
      <button class="btn btn-sm" id="btnZoomOut">－ 축소</button>
      <button class="btn btn-sm" id="btnZoomReset">⊡ 원래 크기</button>
    </div>
  </div>

  <!-- ====== STATS VIEW ====== -->
  <div id="viewStats" style="display:none;">
    <div class="stats-bar" id="statsBar"></div>
    <div class="table-wrap" id="statsDetail"></div>
  </div>

</div>

<!-- 상세 모달 -->
<div class="overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">상세 정보</h3>
      <button class="close-x" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
