<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCPC 묘지 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ====== INTRO ====== -->
<div id="introOverlay">
  <div id="introMap">
    <img id="introMapImg" src="cemetery-map.png" alt="Ridgewood Cemetery Map">
  </div>
  <div id="introCenter">
    <div class="intro-logo">⛪</div>
    <div class="intro-title">CCPC 묘지 관리 시스템</div>
    <div class="intro-sub">Chicago Covenant Presbyterian Church</div>
    <div class="intro-buttons">
      <button class="intro-btn intro-btn-view" onclick="startApp('view')">
        <span class="intro-btn-icon">👁</span>
        <span class="intro-btn-label">조회 모드</span>
        <span class="intro-btn-desc">묘지 현황 조회</span>
      </button>
      <button class="intro-btn intro-btn-admin" onclick="checkAdminPassword()">
        <span class="intro-btn-icon">🔑</span>
        <span class="intro-btn-label">관리자 모드</span>
        <span class="intro-btn-desc">장례 위원장 전용</span>
      </button>
    </div>
  </div>
</div>

<!-- ====== 앱 본체 (세로 flex) ====== -->
<header class="app-header">
  <div class="app-title">
    <span class="mark">⛪ CCPC 묘지 관리</span>
    <span class="sub">Chicago Covenant Presbyterian Church · Cemetery Records</span>
  </div>
  <div class="header-actions">
    <button class="btn" id="btnSync">⟳ 새로고침</button>
    <span id="btnAdminToggle" style="font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:7px 14px;">⚙ 관리자 모드</span>
    <span class="btn btn-ghost" id="btnViewMode" style="display:none;cursor:default;color:var(--sage);font-weight:600;">👁 조회 모드</span>
  </div>
</header>

<!-- 컨트롤 바 (스크롤해도 고정) -->
<div class="control-bar">
  <div class="toolbar">
    <div class="section-switch">
      <div class="chip active" data-section="15">Section 15</div>
      <div class="chip" data-section="16">Section 16</div>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" data-view="stats">📊 통계</button>
      <button class="view-tab" data-view="report">📋 규정 및 현황</button>
      <button class="view-tab" data-view="list">📋 List View</button>
      <button class="view-tab" data-view="map">🗺 Map View</button>
      <button class="view-tab" onclick="openLotView(null,null)">🗾 Lot View</button>
      <button class="view-tab" data-view="pdfview">📄 PDF View</button>
    </div>
    <div class="search-box" id="searchWrap">
      <span class="icon">🔎</span>
      <input type="text" id="searchInput" placeholder="이름 검색 후 Enter...">
      <button id="searchClear" class="search-clear" style="display:none;" title="검색 지우기">✕</button>
    </div>
    <!-- 범례 + 연결 상태를 검색창 오른쪽에 배치 -->
    <div class="legend" id="legendBar">
      <div class="legend-item"><span class="swatch A"></span> Available</div>
      <div class="legend-item"><span class="swatch R"></span> Reserved</div>
      <div class="legend-item"><span class="swatch C"></span> 확인 필요</div>
      <div class="legend-item"><span class="swatch U"></span> Used</div>
      <span class="muted" id="lastSync"></span>
      <!-- Map View 줌 버튼 — 항상 오른쪽 끝, Map View일 때만 보임 -->
      <div id="mapZoomBtns" style="display:none;margin-left:auto;gap:4px;align-items:center;display:flex;">
        <button class="btn btn-sm" id="btnZoomIn">＋</button>
        <button class="btn btn-sm" id="btnZoomOut">－</button>
        <button class="btn btn-sm" id="btnZoomReset">⊡</button>
      </div>
    </div>
  </div>
</div>

<!-- 메인 콘텐츠 (뷰별 교체) -->
<div class="main" id="mainArea">

  <!-- LIST VIEW -->
  <div id="viewList">
    <div class="list-wrap" id="listContainer"></div>
  </div>

  <!-- MAP VIEW — 현재 섹션 인터랙티브 그리드 전체 화면 -->
  <div id="viewMap" style="display:none;" class="full-view">
    <div class="map-img-wrap full-map-wrap" id="mapImgWrap"></div>
  </div>

  <!-- PDF VIEW — 현재 섹션 PDF 전체 화면 -->
  <div id="viewPdf" style="display:none;" class="full-view">
    <div class="map-topbar">
      <button class="btn btn-sm" id="btnPdfZoomIn">＋</button>
      <button class="btn btn-sm" id="btnPdfZoomOut">－</button>
      <button class="btn btn-sm" id="btnPdfZoomReset">⊡</button>
      <span class="muted" style="font-size:12px;margin-left:6px;" id="pdfLabel"></span>
    </div>
    <div class="pdf-scroll-wrap full-pdf-wrap" id="pdfMainWrap">
      <img id="pdfMainImg" src="" alt="PDF View">
    </div>
  </div>

  <!-- STATS VIEW -->
  <div id="viewStats" style="display:none;">
    <div class="stats-bar" id="statsBar"></div>
    <div class="table-wrap" id="statsDetail"></div>
  </div>

  <!-- REPORT VIEW — 규정 및 현황 -->
  <div id="viewReport" style="display:none;">
    <div id="reportBody"></div>
  </div>

</div>
<div class="overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">상세 정보</h3>
      <button class="close-x" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Lot View 팝업 -->
<div class="overlay" id="lotViewOverlay" style="display:none;">
  <div class="modal" style="max-width:96vw;width:96vw;max-height:95vh;display:flex;flex-direction:column;padding:0;">
    <div class="modal-header" style="flex-shrink:0;padding:10px 16px;border-bottom:1px solid var(--line);">
      <h3 id="lotViewTitle" style="font-size:15px;">🗾 Section 15 &amp; 16 구역도</h3>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn btn-sm" onclick="lvZoom(1.3)">＋</button>
        <button class="btn btn-sm" onclick="lvZoom(0.77)">－</button>
        <button class="btn btn-sm" onclick="lvReset()">⊡</button>
        <button class="close-x" onclick="closeLotView()">&times;</button>
      </div>
    </div>
    <div id="lotViewBody" style="flex:1;overflow:auto;cursor:grab;position:relative;min-height:0;background:#f5f3ee;">
      <div id="lotViewInner" style="position:relative;display:inline-block;transform-origin:top left;">
        <img id="lotViewImg" src="lot_map_clean.jpg" alt="Lot Map"
          style="display:block;width:1588px;height:1605px;transform:rotate(-15deg);transform-origin:center center;user-select:none;-webkit-user-drag:none;">
        <!-- SVG 오버레이: 이미지와 동일 크기/회전 -->
        <svg id="lv-overlay" xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 1588 1605"
          style="position:absolute;top:0;left:0;width:1588px;height:1605px;transform:rotate(-15deg);transform-origin:center center;pointer-events:none;">
          <g id="lv-lots" style="pointer-events:all;cursor:crosshair;"></g>
          <rect id="lv-hi-rect" x="0" y="0" width="0" height="0"
            fill="rgba(230,57,70,0.2)" stroke="#e63946" stroke-width="3" rx="2"
            style="display:none;pointer-events:none;"/>
          <circle id="lv-hi-circ" cx="0" cy="0" r="0"
            fill="rgba(230,57,70,0.2)" stroke="#e63946" stroke-width="3"
            style="display:none;pointer-events:none;"/>
        </svg>
      </div>
    </div>
    <div style="flex-shrink:0;padding:6px 14px;font-size:11px;color:#888;border-top:1px solid var(--line);">
      S15: Lot 1~466 &nbsp;|&nbsp; S16: Lot 1~458 &nbsp;|&nbsp; 스크롤/드래그 탐색, +- 줌
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="layout.js"></script>
<script src="app.js"></script>
<script src="report.js"></script>
<script src="lotview.js"></script>
</body>
</html>
