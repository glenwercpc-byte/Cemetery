<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCPC 묘지 구역도 — Section 15 & 16</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f5f3ee;
  color: #2d2b26;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #1a1812;
  color: white;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: .03em; }
header .sub { font-size: 11px; opacity: .6; }
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f5f3ee;
  padding: 8px 16px;
  border-bottom: 1px solid #ddd;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.zoom-btns { display: flex; gap: 4px; }
.btn {
  padding: 5px 12px;
  border: 1px solid #bbb;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.btn:hover { background: #eee; }
.btn.active { background: #1a1812; color: white; border-color: #1a1812; }
.legend {
  display: flex;
  gap: 12px;
  font-size: 12px;
  align-items: center;
  margin-left: auto;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.swatch {
  width: 14px; height: 14px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,.2);
}
.sw-15 { background: #c8e6c9; }
.sw-16 { background: #bbdefb; }
.sw-hover { background: #ffe082; }

/* 뷰어 */
.viewer {
  flex: 1;
  overflow: auto;
  position: relative;
  cursor: grab;
  min-height: 0;
}
.viewer:active { cursor: grabbing; }
.viewer-inner {
  display: flex;
  gap: 0;
  align-items: flex-start;
  transform-origin: top left;
  padding: 20px;
  width: max-content;
}
.section-wrap {
  position: relative;
  flex-shrink: 0;
}
.section-wrap img {
  display: block;
  width: 680px;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}
.section-label {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26,24,18,.8);
  color: white;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: .04em;
  pointer-events: none;
}
.section-divider {
  width: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.section-divider-line {
  width: 2px;
  height: 200px;
  background: linear-gradient(to bottom, transparent, #aaa, transparent);
}

/* 툴팁 */
#tooltip {
  position: fixed;
  background: #1a1812;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  pointer-events: none;
  display: none;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}

/* 정보 패널 */
#infoPanel {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  font-size: 13px;
  display: none;
  z-index: 998;
  min-width: 300px;
  text-align: center;
}
#infoPanel .lot-num {
  font-size: 18px;
  font-weight: 700;
  color: #1a1812;
  margin-bottom: 4px;
}
#infoPanel .lot-sec {
  color: #888;
  font-size: 11px;
  margin-bottom: 10px;
}
#infoPanel .info-btns {
  display: flex;
  gap: 8px;
  justify-content: center;
}
#infoPanel .info-btn {
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid #ddd;
  background: #f5f3ee;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}
#infoPanel .info-btn.primary {
  background: #1a1812;
  color: white;
  border-color: #1a1812;
}
#infoPanel .close-x {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 16px;
  cursor: pointer;
  color: #aaa;
  background: none;
  border: none;
}
</style>
</head>
<body>

<header>
  <div>
    <div class="sub">Ridgewood Memorial Park · Chicago Covenant Presbyterian Church</div>
    <h1>⛪ CCPC 묘지 구역도 — Section 15 &amp; 16</h1>
  </div>
  <div style="font-size:11px;opacity:.5;text-align:right;">
    Lot 번호를 클릭하면<br>상세 정보를 볼 수 있습니다
  </div>
</header>

<div class="controls">
  <div class="zoom-btns">
    <button class="btn" onclick="zoom(1.2)">＋</button>
    <button class="btn" onclick="zoom(1/1.2)">－</button>
    <button class="btn" onclick="resetZoom()">⊡ 전체</button>
  </div>
  <div style="font-size:12px;color:#888;">
    스크롤/드래그로 탐색 &nbsp;|&nbsp; 핀치 줌 지원
  </div>
  <div class="legend">
    <div class="legend-item"><span class="swatch sw-15"></span> Section 15</div>
    <div class="legend-item"><span class="swatch sw-16"></span> Section 16</div>
    <div class="legend-item"><span class="swatch sw-hover"></span> 선택됨</div>
  </div>
  <button class="btn" onclick="openApp()">🔗 관리 앱 열기</button>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-inner" id="viewerInner">
    <!-- Section 15 -->
    <div class="section-wrap">
      <div class="section-label" style="background:rgba(46,125,82,.85);">Section 15</div>
      <img src="section15_hd.png" id="s15img" alt="Section 15"
        onclick="handleImgClick(event,'15')"
        onmousemove="handleImgHover(event,'15')"
        onmouseleave="hideTooltip()">
    </div>

    <div class="section-divider"><div class="section-divider-line"></div></div>

    <!-- Section 16 -->
    <div class="section-wrap">
      <div class="section-label" style="background:rgba(25,118,210,.85);">Section 16</div>
      <img src="section16_hd.png" id="s16img" alt="Section 16"
        onclick="handleImgClick(event,'16')"
        onmousemove="handleImgHover(event,'16')"
        onmouseleave="hideTooltip()">
    </div>
  </div>
</div>

<div id="tooltip"></div>

<div id="infoPanel" style="position:fixed;">
  <button class="close-x" onclick="closePanel()">✕</button>
  <div class="lot-num" id="panelLot"></div>
  <div class="lot-sec" id="panelSec"></div>
  <div class="info-btns">
    <button class="info-btn primary" onclick="openInApp('map')">🗺 Map View</button>
    <button class="info-btn" onclick="openInApp('list')">📋 List View</button>
    <button class="info-btn" onclick="closePanel()">닫기</button>
  </div>
</div>

<script>
// ── 줌/드래그 ─────────────────────────────
let scale = 1;
const viewer = document.getElementById('viewer');
const inner = document.getElementById('viewerInner');

function zoom(factor) {
  scale = Math.min(Math.max(scale * factor, 0.3), 4);
  inner.style.transform = `scale(${scale})`;
}
function resetZoom() {
  scale = 1;
  inner.style.transform = 'scale(1)';
  viewer.scrollLeft = 0;
  viewer.scrollTop = 0;
}

viewer.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY > 0 ? 0.9 : 1.1);
}, { passive: false });

let drag = false, sx, sy, sl, st;
viewer.addEventListener('mousedown', e => {
  drag = true; sx = e.pageX; sy = e.pageY;
  sl = viewer.scrollLeft; st = viewer.scrollTop;
});
viewer.addEventListener('mouseleave', () => drag = false);
viewer.addEventListener('mouseup', () => drag = false);
viewer.addEventListener('mousemove', e => {
  if (!drag) return;
  viewer.scrollLeft = sl - (e.pageX - sx);
  viewer.scrollTop  = st - (e.pageY - sy);
});

// 터치 핀치 줌
let initDist = 0;
viewer.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });
viewer.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    zoom(dist / initDist);
    initDist = dist;
  }
}, { passive: true });

// ── 이미지에서 lot 번호 추정 ──────────────
// Section 15: 삼각형, lot 번호 1~466 (전체 구획)
// Section 16: 부채꼴, lot 번호 1~457 (전체 구획)
// 이미지 좌표 → 대략적인 lot 번호 추정
// (실제 정밀 매핑은 PDF 좌표 분석 필요 — 현재는 구역 기반 추정)

function estimateLot15(rx, ry) {
  // Section 15: 삼각형 구조, 상단 꼭짓점에서 하단으로
  // 하단(Circle Ave)에 lot 1~17, 위로 올라갈수록 번호 증가
  // rx: 0~1 (좌→우), ry: 0~1 (상→하)
  // 대략적 추정
  const row = Math.floor(ry * 22);          // 약 22행
  const col = Math.floor(rx * (row + 1));   // 삼각형이므로 위로 갈수록 좁음
  const lot = Math.max(1, Math.min(466, row * 20 + col + 1));
  return lot;
}

function estimateLot16(rx, ry) {
  // Section 16: 격자형, 약 20열 × 22행
  const row = Math.floor(ry * 22);
  const col = Math.floor(rx * 20);
  const lot = Math.max(1, Math.min(457, row * 20 + col + 1));
  return lot;
}

// ── 앱 URL ───────────────────────────────
const APP_URL = 'https://glenwercpc-byte.github.io/Cemetery/';
let selectedSection = '15';
let selectedLot = null;

function handleImgClick(e, section) {
  const img = e.currentTarget;
  const rect = img.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / rect.width;
  const ry = (e.clientY - rect.top)  / rect.height;

  // 이미지 바깥 클릭 무시
  if (rx < 0 || rx > 1 || ry < 0 || ry > 1) return;

  const lot = section === '15' ? estimateLot15(rx, ry) : estimateLot16(rx, ry);
  selectedSection = section;
  selectedLot = lot;

  document.getElementById('panelLot').textContent = `Lot ${lot}`;
  document.getElementById('panelSec').textContent = `Section ${section}`;
  document.getElementById('infoPanel').style.display = 'block';
}

function handleImgHover(e, section) {
  const img = e.currentTarget;
  const rect = img.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / rect.width;
  const ry = (e.clientY - rect.top)  / rect.height;
  const lot = section === '15' ? estimateLot15(rx, ry) : estimateLot16(rx, ry);

  const tt = document.getElementById('tooltip');
  tt.textContent = `Section ${section} · Lot ${lot}`;
  tt.style.display = 'block';
  tt.style.left = (e.clientX + 14) + 'px';
  tt.style.top  = (e.clientY - 10) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

function closePanel() {
  document.getElementById('infoPanel').style.display = 'none';
}

function openInApp(view) {
  if (!selectedLot) return;
  const url = `${APP_URL}?section=${selectedSection}&view=${view}&lot=${selectedLot}`;
  window.open(url, '_blank');
}

function openApp() {
  window.open(APP_URL, '_blank');
}
</script>
</body>
</html>
